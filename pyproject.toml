[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-restart"
version = "0.1.0"
description = "Restart an entire UniFi network (switches, APs, gateway) on a daily schedule via the Network API"
requires-python = ">=3.8"
dependencies = ["requests"]

[project.optional-dependencies]
pretty = ["tabulate"]

[project.scripts]
unifi-restart = "unifi_restart:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["unifi_restart*"]
